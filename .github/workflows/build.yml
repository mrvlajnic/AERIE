name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # WebKit for Windows: the WinCairo build Playwright publishes, pinned by
  # revision and by the SHA-256 of the archive itself.
  WEBKIT_REVISION: "2395"
  WEBKIT_SHA256: "9707661aeefebffe464ba471e81149b330f242efdb2101c6bc288f4fe9da35f6"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Search.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            # Small: needs the .NET 8 Desktop Runtime (Windows offers to install it on first launch).
            dotnet publish src/Search -c Release -r $rid --self-contained false `
              -p:PublishSingleFile=true -o "out/$rid"
            # Standalone: brings its own .NET, nothing else to install.
            dotnet publish src/Search -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o "out/$rid-standalone"
            Rename-Item "out/$rid/Search.exe" "Search-$rid.exe"
            Rename-Item "out/$rid-standalone/Search.exe" "Search-$rid-standalone.exe"
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "smoke"
          ./tools/smoke.ps1 -Exe "out/win-x64/Search-win-x64.exe" -Data $data

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc.FullName "/DAppVersion=$version" "installer\search.iss"

      - name: Package the WebKit build
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\webkit-win64.zip"
          Invoke-WebRequest "https://cdn.playwright.dev/dbazure/download/playwright/builds/webkit/$env:WEBKIT_REVISION/webkit-win64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WEBKIT_SHA256) { throw "WebKit archive hash $hash does not match the pinned $env:WEBKIT_SHA256" }
          $dir = "out/Search-WebKit-win-x64"
          dotnet publish src/Search -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o $dir
          Expand-Archive $zip -DestinationPath $dir -Force
          # The zip must land flat: Search.exe falls back to WebView2 silently
          # when WebKit2.dll is not beside it.
          if (-not (Test-Path "$dir/WebKit2.dll")) { throw "WebKit2.dll is missing from the downloaded archive" }
          # Playwright's own test shell isn't part of Search.
          Remove-Item "$dir/Playwright.exe", "$dir/protocol.json" -ErrorAction SilentlyContinue
          # The LGPL-2.1 and BSD-2-Clause texts ship with the browser, plus
          # anything the archive itself carried, named to show its origin.
          $lic = Join-Path $dir "THIRD-PARTY-LICENSES"
          New-Item -ItemType Directory -Force $lic | Out-Null
          Copy-Item "THIRD-PARTY-LICENSES/*" $lic -Force
          Get-ChildItem -Path "$dir/*" -Recurse -File -Include "LICENSE*", "COPYING*", "NOTICE*" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "$lic*" } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $lic ("webkit-" + $_.Name)) -Force }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $dir
          Compress-Archive "$dir/*" "out/Search-WebKit-win-x64.zip"
          Get-ChildItem out -Recurse -Include *.exe, *.zip -Depth 1 | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Search-windows
          path: |
            out/win-*/*.exe
            out/Search-setup.exe
            out/Search-WebKit-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bench-builds
          retention-days: 3
          path: |
            out/win-x64/Search-win-x64.exe
            out/Search-WebKit-win-x64/**

  # The same sites in each engine, on the same machine: what the whole
  # browser (every process it starts) holds in memory.
  memory:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: bench-builds
          path: builds

      - name: Run the benchmark
        shell: pwsh
        run: |
          $webview2 = (Get-ChildItem builds -Recurse -Filter Search-win-x64.exe | Select-Object -First 1).FullName
          $webkit = (Get-ChildItem builds -Recurse -Filter Search.exe | Where-Object { Test-Path (Join-Path $_.DirectoryName WebKit2.dll) } | Select-Object -First 1).FullName
          $setups = @(
            @{ name = "webview2"; exe = $webview2; engine = "webview2"; settings = '{}' },
            @{ name = "webkit"; exe = $webkit; engine = "webkit"; settings = '{}' },
            @{ name = "webkit-not-lean"; exe = $webkit; engine = "webkit"; settings = '{"lean": false}' },
            @{ name = "webkit-shared-process"; exe = $webkit; engine = "webkit"; settings = '{"sharedProcess": true}' }
          )
          New-Item -ItemType Directory bench | Out-Null
          # A crash leaves a dump; the debugger names where it happened.
          $dumps = Join-Path $env:RUNNER_TEMP "dumps"
          New-Item -ItemType Directory $dumps | Out-Null
          foreach ($exe in "Search.exe", "Search-win-x64.exe") {
            $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty $k DumpFolder $dumps; Set-ItemProperty $k DumpType 1; Set-ItemProperty $k DumpCount 5
          }
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($s in $setups) {
            $data = Join-Path $env:RUNNER_TEMP "data-$($s.name)"
            New-Item -ItemType Directory $data | Out-Null
            Set-Content (Join-Path $data "settings.json") $s.settings
            $out = Join-Path (Resolve-Path bench) "bench-$($s.name).json"
            Write-Host "== $($s.name): $($s.exe)"
            $p = Start-Process $s.exe -ArgumentList "--engine=$($s.engine)", "--bench=$out", "--data=$data" -PassThru
            $exited = $p.WaitForExit(420000)
            if (-not $exited) { Write-Host "timed out"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $code = if ($exited) { $p.ExitCode } else { -1 }
            Write-Host "exit code: $code"
            Get-Process | Where-Object { $_.ProcessName -match 'WebKit|msedgewebview2|Search' } | Stop-Process -Force -ErrorAction SilentlyContinue
            if (Test-Path (Join-Path $data "errors.log")) { Copy-Item (Join-Path $data "errors.log") "bench/errors-$($s.name).log"; Get-Content (Join-Path $data "errors.log") | Select-Object -First 60 }
            if (Test-Path (Join-Path $data "trace.log")) { Copy-Item (Join-Path $data "trace.log") "bench/trace-$($s.name).log"; Write-Host "-- last steps:"; Get-Content (Join-Path $data "trace.log") | Select-Object -Last 25 }
            if (Test-Path $out) { $j = Get-Content $out -Raw | ConvertFrom-Json; foreach ($x in $j.samples) { Write-Host ("{0}: {1:N0} MB private, {2:N0} MB working set" -f $x.label, $x.privateMB, $x.workingSetMB); $x.byProcess.PSObject.Properties | ForEach-Object { Write-Host ("    {0}: {1}" -f $_.Name, $_.Value) } } }
            # The default engine must prove it works; the experimental WebKit
            # build is allowed to fail without turning the whole job red.
            if ($code -ne 0 -and $s.name -eq "webview2") { throw "$($s.name) exited $code" }
            if (-not (Test-Path $out)) {
              if ($s.name -eq "webview2") { throw "$($s.name) wrote no report" }
              Write-Host "::warning::$($s.name) wrote no report"
            }
            Start-Sleep 3
            $dump = Get-ChildItem $dumps -Filter *.dmp | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($dump -and $cdb) {
              Write-Host "-- crash dump $($dump.Name):"
              & $cdb.FullName -z $dump.FullName -c ".ecxr; kn 25; q" 2>&1 | Select-String -Pattern "^\s*[0-9a-f]{2} |ExceptionCode|Attempt to|FAULTING|^\w+!" | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
              Move-Item $dump.FullName "bench/crash-$($s.name).dmp"
            } elseif ($dump) { Write-Host "dump written but no debugger found"; Move-Item $dump.FullName "bench/crash-$($s.name).dmp" }
          }
          ./tools/bench-summary.ps1 bench | Tee-Object -FilePath bench/summary.md | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content bench/summary.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-benchmark
          path: bench/
  # A tag releases only after the engine has also passed its benchmark.
  release:
    needs: [build, memory]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Search-windows
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
          generate_release_notes: true